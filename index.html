    // Storage shim: mirrors Claude artifact's window.storage API, backed by localStorage
    const STORAGE_PREFIX = 'argus_tracker_';
    window.storage = {
      async get(key) {
        const raw = localStorage.getItem(STORAGE_PREFIX + key);
        if (raw === null) { throw new Error('key not found'); }
        return { key, value: raw, shared: false };
      },
      async set(key, value) {
        try {
          localStorage.setItem(STORAGE_PREFIX + key, value);
          return { key, value, shared: false };
        } catch (e) {
          console.error('storage set failed', e);
          return null;
        }
      },
      async delete(key) {
        localStorage.removeItem(STORAGE_PREFIX + key);
        return { key, deleted: true, shared: false };
      },
      async list(prefix) {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(STORAGE_PREFIX)) {
            const bare = k.slice(STORAGE_PREFIX.length);
            if (!prefix || bare.startsWith(prefix)) keys.push(bare);
          }
        }
        return { keys, prefix, shared: false };
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });

    // Show any load-time error directly on screen instead of a silent blank page
    function showBootError(msg, showRetry) {
      const el = document.getElementById('boot-status');
      if (!el) return;
      el.innerHTML =
        '<p style="color:#dc2626;font-weight:bold;font-size:15px;">Kuch gadbad hui</p>' +
        '<p style="font-size:12px;color:#475569;max-width:320px;word-break:break-word;margin-top:8px;">' + msg + '</p>' +

        '<p style="font-size:11px;color:#94a3b8;margin-top:10px;">Is message ka screenshot le kar bhej dein</p>';
    }
    window.addEventListener('error', function (e) {
      showBootError((e && e.message) || 'Unknown script error', true);
    });
    window.addEventListener('unhandledrejection', function (e) {
      showBootError('Promise error: ' + ((e.reason && e.reason.message) || e.reason), true);
    });

    // Safety timeout: if app hasn't mounted in 45s, tell the user instead of staying blank
    setTimeout(function () {
      const el = document.getElementById('boot-status');
      if (el && document.getElementById('boot-status')) {
        showBootError('Loading mein bahut zyada time lag raha hai. Internet dheema ho sakta hai — WiFi ya behtar network try karein.', true);
      }
    }, 45000);

function parseDate(d) {
    if (!d)
        return null;
    const parts = d.split('/');
    if (parts.length !== 3)
        return null;
    let [dd, mm, yy] = parts;
    yy = yy.length === 2 ? (parseInt(yy) < 50 ? '20' + yy : '19' + yy) : yy;
    const dt = new Date(parseInt(yy), parseInt(mm) - 1, parseInt(dd));
    return isNaN(dt.getTime()) ? null : dt;
}
function daysUntil(dateStr) {
    const dt = parseDate(dateStr);
    if (!dt)
        return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    dt.setHours(0, 0, 0, 0);
    return Math.round((dt - today) / 86400000);
}

function loadScriptOnce(src) {
    return new Promise((resolve, reject) => {
        if (typeof document === 'undefined') {
            reject(new Error('no document'));
            return;
        }
        if (document.querySelector(`script[data-lib="${src}"]`)) {
            resolve();
            return;
        }
        const s = document.createElement('script');
        s.src = src;
        s.setAttribute('data-lib', src);
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Library load nahi hui: ' + src));
        document.head.appendChild(s);
    });
}
async function buildQuotationPdf(quote, signatureImg) {
    await loadScriptOnce('https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js');
    await loadScriptOnce('https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js');
    const canvas = await captureQuotationCanvas(quote, signatureImg);
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    let renderWidth = pageWidth;
    let renderHeight = (canvas.height * renderWidth) / canvas.width;
    // Agar content ek page se lamba hai to poore page mein fit kar dein (chhota dikhega par ek hi page rahega)
    if (renderHeight > pageHeight) {
        renderHeight = pageHeight;
        renderWidth = (canvas.width * renderHeight) / canvas.height;
    }
    const xOffset = (pageWidth - renderWidth) / 2;
    const yOffset = (pageHeight - renderHeight) / 2;
    pdf.addImage(imgData, 'PNG', xOffset, Math.max(0, yOffset), renderWidth, renderHeight);
    return pdf;
}
async function downloadQuotationPDF(quote, signatureImg) {

}
function parseUploadedFile(file) {
    return new Promise((resolve, reject) => {
        const name = file.name.toLowerCase();
        if (name.endsWith('.csv')) {
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: (res) => resolve(res.data),
                error: reject,
            });
        }
        else {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const wb = XLSX.read(e.target.result, { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
                    resolve(rows);
                }
                catch (err) {
                    reject(err);
                }
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        }
    });
}
function getField(row, ...keys) {
    const rowKeys = Object.keys(row);
    for (const k of keys) {
        const found = rowKeys.find(rk => rk.trim().toLowerCase().replace(/[.\s]/g, '') === k.toLowerCase().replace(/[.\s]/g, ''));
        if (found && row[found] !== undefined && row[found] !== '')
            return String(row[found]).trim();
    }
    return '';
}

    inner.style.fontSize = '14px';
    inner.style.color = '#1e293b';

            height: fullHeight,

            windowHeight: fullHeight,
            scrollX: 0,
            scrollY: 0,
            x: 0,
            y: 0,
        });

    }
